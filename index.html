<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok コメントオーバーレイ (HTTPS)</title>
<style>
  body {
      margin: 0;
      overflow: hidden;
      background: #00ff00; /* クロマキー用緑背景 */
  }
  .comment {
      position: absolute;
      white-space: nowrap;
      font-weight: bold;
      font-family: "MS Gothic", "Meiryo", sans-serif;
      color: #ffffff;
      text-shadow:
         -3px -3px 0 #000, -3px 0 0 #000, -3px 3px 0 #000,
         0 -3px 0 #000, 0 3px 0 #000,
         3px -3px 0 #000, 3px 0 0 #000, 3px 3px 0 #000;
  }
  .member {
      color: #ffd700;
      font-size: 60px !important;
  }
  #config {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 40px;
      border-radius: 10px;
      font-family: sans-serif;
      text-align: center;
      z-index: 9999;
  }
  #config input {
      padding: 10px;
      font-size: 18px;
      width: 300px;
      margin: 20px 0;
  }
  #config button {
      padding: 12px 30px;
      font-size: 18px;
      background: #00d9ff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      font-weight: bold;
  }
  #config button:hover {
      background: #00b8d4;
  }
  #status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      display: none;
  }
  .connected { color: #0f0; }
  .disconnected { color: #f00; }
</style>
</head>
<body>

<div id="config">
  <h1>🎥 TikTok コメントオーバーレイ</h1>
  <p>配信者のTikTok IDを入力してください</p>
  <input type="text" id="username" placeholder="例: ahomal3" />
  <br>
  <button onclick="connect()">接続開始</button>
</div>

<div id="status">
  状態: <span id="connection-status" class="disconnected">切断</span>
</div>

<script>
// Cloudflare WorkersのURL（ステップ2で確認したURL）
const WS_SERVER = 'wss://tiktok-overlay-ws.あなたのアカウント名.workers.dev';

let ws = null;

function connect() {
    const username = document.getElementById('username').value.trim();
    
    if (!username) {
        alert('配信者IDを入力してください');
        return;
    }

    // 設定画面を非表示
    document.getElementById('config').style.display = 'none';
    document.getElementById('status').style.display = 'block';

    // WebSocket接続
    ws = new WebSocket(`${WS_SERVER}?username=${username}`);

    ws.onopen = () => {
        console.log('接続成功');
        document.getElementById('connection-status').textContent = '接続中';
        document.getElementById('connection-status').className = 'connected';
    };

    ws.onclose = () => {
        document.getElementById('connection-status').textContent = '切断';
        document.getElementById('connection-status').className = 'disconnected';
    };

    ws.onerror = (error) => {
        console.error('接続エラー:', error);
        document.getElementById('connection-status').textContent = 'エラー';
        document.getElementById('connection-status').className = 'disconnected';
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        displayComment(data);
    };
}

function displayComment(data) {
    const div = document.createElement('div');

    if (data.type === 'comment') {
        div.className = 'comment';

        if (Array.isArray(data.items)) {
            data.items.forEach(item => {
                if (item.type === 'text') {
                    const span = document.createElement('span');
                    span.textContent = item.value;
                    div.appendChild(span);
                }

                if (item.type === 'emote') {
                    const img = document.createElement('img');
                    img.src = item.value;
                    img.style.height = '1.6em';
                    img.style.verticalAlign = 'middle';
                    img.style.margin = '0 2px';
                    div.appendChild(img);
                }
            });
        }

        const fontSize = Math.floor(Math.random() * 18) + 40;
        div.style.fontSize = fontSize + 'px';

    } else if (data.type === 'member') {
        div.className = 'comment member';
        div.textContent = data.comment;
    }

    document.body.appendChild(div);

    const maxTop = window.innerHeight - div.offsetHeight;
    div.style.top = Math.random() * Math.max(maxTop, 0) + 'px';

    let pos = window.innerWidth;
    const speed = Math.random() * 2 + 4;

    function animate() {
        pos -= speed;
        div.style.transform = `translateX(${pos}px)`;
        if (pos + div.offsetWidth > 0) {
            requestAnimationFrame(animate);
        } else {
            div.remove();
        }
    }

    requestAnimationFrame(animate);
}

// URLパラメータから自動接続
const params = new URLSearchParams(window.location.search);
const autoUsername = params.get('username');
if (autoUsername) {
    document.getElementById('username').value = autoUsername;
    connect();
}
</script>

</body>
</html>
